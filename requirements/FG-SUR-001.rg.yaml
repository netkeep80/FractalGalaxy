format: repo-guard/requirement-v1
id: FG-SUR-001
normative: "### FG-SUR-001 — Согласованное двумерное уточнение границы\n\nMUST: наружные грани кубических областей допускают двумерное рекурсивное уточнение по четырём дочерним участкам и устойчивую локальную адресацию. Уточнения поверхности и объёма должны согласовываться по общей границе. MUST: границы разных уровней детализации не создают физически противоречивую поверхность; непрерывность значения материала и геометрические швы проверяются отдельно."
