normative: "### FG-GEO-007 — Кубическая сетка является грубым фрактальным каркасом\n\nКубическая octree-сетка должна задавать каноническую топологию, адресацию и исходные shared vertices, но не должна считаться окончательной геометрией материи. Фактическая граница вещества может отклоняться от этого каркаса посредством авторитетной процедурной и persistent vertex deformation."
