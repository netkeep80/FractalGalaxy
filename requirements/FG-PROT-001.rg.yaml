format: repo-guard/requirement-v1
id: FG-PROT-001
normative: "### FG-PROT-001 — Исполняемый прототип E0\n\nВ pull request должен находиться небольшой исполняемый CPU-прототип ключевых идей FractalMatter/FractalRing: детерминированное процедурное уточнение, B/D/Γ и материальный запрос M, владение после Split, явные Contact/Attach/Detach и холодное Save/Load. Прототип может сознательно упрощать будущий игровой движок, но его ограничения должны быть перечислены, а ключевое поведение — покрыто запускаемыми тестами."
lifecycle:
  accepted: true
  current: true
  published: false
relations:
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: "src/fractal-matter.mjs"
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: "package.json"
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: "examples/e0-demo.mjs"
  - predicates: [verified_by]
    target:
      kind: artifact
      path: "tests/e0.test.mjs"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/prototype.md"
  - predicates: [documents]
    target:
      kind: artifact
      path: "README.md"
  - predicates: [derives_from]
    target:
      kind: requirement
      id: FG-DEMO-000
