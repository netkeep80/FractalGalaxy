format: repo-guard/requirement-v1
id: FG-DYN-001
normative: "### FG-DYN-001 — Физические свойства и гравитация\n\nMUST: масса, центр масс и тензор инерции тела согласованы с текущей материальной моделью, а не с визуальной детализацией. MUST: дальние гравитационные расчёты могут использовать агрегированные источники и заданный бюджет ошибки; объединение независимых тел ради ускорения расчёта не должно менять их фактическую материальную и механическую принадлежность. При подлинном сращивании число независимо интегрируемых физических тел может уменьшаться."
lifecycle:
  accepted: false
  current: false
  published: false
relations:
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/architecture.md"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/verification-plan.md"
