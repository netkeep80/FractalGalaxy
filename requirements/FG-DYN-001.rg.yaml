format: repo-guard/requirement-v1
id: FG-DYN-001
normative: "### FG-DYN-001 — Актуальность массы и полного тензора инерции\n\nМассу, центр масс и полный тензор инерции материального тела система должна получать из текущей версии M либо из кэша, согласованного с этой версией; изменение D должно делать старые агрегаты недействительными. Для составного FractalRing эти величины должны вычисляться по уникальным материальным потомкам с учётом вращений и переносов в общий базис."
