normative: "### FG-DYN-001 — Агрегированная физика FractalRing и гравитация\n\nMUST: у каждого независимого физического FractalRing есть согласованные с текущим веществом массовые характеристики, а новый жёсткий агрегат может интегрироваться как единое тело с массой и тензором инерции его детей. Дети сохраняют собственные генераторы и их массы входят в агрегат ровно один раз. Дальние гравитационные источники MAY агрегироваться без фактического физического слипания, при заданном бюджете погрешности; при отрыве обновляются агрегаты и независимые движения. Физические расчёты и материальное состояние не зависят от LOD."
