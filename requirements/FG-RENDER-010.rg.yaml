normative: "### FG-RENDER-010 — Региональная сборка и LOD остаются производными\n\nИзменение render tessellation, порядка регионального обхода или отображаемого LOD не должно менять материальную классификацию, D, записи WorldStore, владение FractalRing или сохранённые canonical vertex offsets. Повторная сборка того же региона после Split или cold load должна сохранять ранее определённые канонические позиции."
