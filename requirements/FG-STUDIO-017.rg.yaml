normative: "### FG-STUDIO-017 — Явное разбиение индивидуализированного кольца\n\nStudio должен предоставлять действие явного разбиения выбранного кольца с persistent geometry offset на дочерние FractalRing. После действия дерево должно отражать созданные дочерние записи, а визуализация — сохранять мировую геометрию исходных вершин. Это действие не эквивалентно LOD refinement и само по себе не является физическим отделением независимых тел."
