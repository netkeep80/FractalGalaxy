format: repo-guard/requirement-v1
id: FG-SPL-003
normative: "### FG-SPL-003 — Сохранение мировых координат при разделении\n\nПри разделении (Split) система должна сопоставить каждой сохраняемой материальной точке новые локальные координаты и физический кадр так, чтобы её мировая координата до и непосредственно после разделения совпадала в пределах допуска E0; проверяется соответствие точек, а не одно лишь равенство матриц преобразований."
