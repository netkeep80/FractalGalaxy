format: repo-guard/requirement-v1
id: FG-RENDER-007
normative: "### FG-RENDER-007 — Региональное извлечение материальных интерфейсов\n\nДля конечного явно заданного набора octree-ячеек одинаковой глубины движок должен перечислять каждую релевантную топологическую пару граней не более одного раза и получать региональный набор интерфейсов из фактической материальной классификации обеих сторон. Только PRESENT может входить в доказанную геометрию; REFINE остаётся неразрешённым, NONE не создаёт поверхность. Выход за глобальную область может использовать явно заданную внешнюю среду. Извлечение не должно изменять M, D, WorldStore или FractalRing."
