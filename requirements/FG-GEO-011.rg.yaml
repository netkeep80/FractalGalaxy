format: repo-guard/requirement-v1
id: FG-GEO-011
normative: "### FG-GEO-011 — Persistent displacement вершины после взаимодействия\n\nЕсли физическое или пользовательское воздействие изменяет фактическую координату канонической вершины, результирующий displacement должен храниться как persistent индивидуализированное состояние и применяться после процедурной деформации/сглаживания. Такое смещение не должно зависеть от renderer и должно переживать cold save/load."
