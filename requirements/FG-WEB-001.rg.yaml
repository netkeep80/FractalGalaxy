format: repo-guard/requirement-v1
id: FG-WEB-001
normative: "### FG-WEB-001 — Интерактивное веб-демо\n\nПроект должен иметь небольшое статическое GitHub Pages демо, запускающее тот же модуль E0-прототипа, что и локальные тесты, и позволяющее наблюдать основные идеи FractalMatter без отдельной серверной части: материальный запрос M, влияние Γ, результирующее изменение D, канонический octree-адрес и композиционное владение после Split. Демо не обязано изображать production-графику или полную физику движка."
lifecycle:
  accepted: false
  current: false
  published: false
relations:
