    target:
      kind: artifact
      path: "demo/index.html"
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: "demo/app.js"
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: "demo/styles.css"
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: ".github/workflows/pages.yml"
  - predicates: [verified_by]
    target:
      kind: artifact
