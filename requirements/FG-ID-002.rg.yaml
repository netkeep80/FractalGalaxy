    target:
      kind: artifact
      path: "docs/architecture.md"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/acceptance-matrix.md"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/requirements-rationale.md"
  - predicates: [derives_from]
    target:
      kind: requirement
      id: FG-RING-000
