format: repo-guard/requirement-v1
id: FG-NEIGH-001
normative: "### FG-NEIGH-001 — Исходное процедурное соседство не зависит от физического\n\nMUST: если генерация потомка использует параметры соседних процедурных областей, эти входы адресуются в канонической системе исходной фрактальной структуры и имеют воспроизводимую неизменяемую семантику. Перемещение, изменение или уничтожение соседнего физического FractalRing не меняет входы уже определённой генеалогии. Реализация не должна хранить обязательные указатели на живых соседних физических объектов или создавать скрытую зависимость от их расстояния в мировых координатах. SHOULD: соседские граничные значения согласованы и воспроизводимы при независимых запросах из разных фрагментов."
lifecycle:
  accepted: false
  current: false
  published: false
