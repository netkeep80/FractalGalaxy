normative: "### FG-NEIGH-001 — Исходное процедурное соседство\n\nПараметры исходного процедурного соседа система должна разрешать по неизменяемому ключу источника и общей границы, а не по текущему физическому объекту. Перемещение, редактирование и уничтожение физического соседа не меняют эти параметры. Контрольное изменение исходного параметра в отдельной фикстуре должно давать ожидаемое изменение зависимого результата."
