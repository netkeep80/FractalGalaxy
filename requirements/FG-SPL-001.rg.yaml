id: FG-SPL-001
normative: "### FG-SPL-001 — Физическое разделение\n\nПри допустимом явном двоичном разделении (Split) исходного материального тела система должна создать два самостоятельных физических корня FractalRing для двух материальных частей и прекратить старое физическое владение разделённым телом. Выделение уже существующего физического дочернего узла (Detach) является другой операцией."
