format: repo-guard/requirement-v1
id: FG-SPL-001
normative: "### FG-SPL-001 — Разделение на самостоятельные физические тела\n\nMUST: после удаления вещества или разрушения механических связей несколько независимых компонент могут стать отдельными MaterialBody / FractalRing. Каждая получает соответствующие ограничения B и D, устойчивую идентичность, собственную систему координат и физическое состояние. Разделение не требует копировать весь исходный фрактальный объём. MUST: не допускать потери или дублирования массы; координаты и линейный/угловой импульсы пересчитываются с учётом внешних воздействий."
lifecycle:
  accepted: false
  current: false
  published: false
relations:
