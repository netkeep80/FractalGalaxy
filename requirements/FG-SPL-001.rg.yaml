format: repo-guard/requirement-v1
id: FG-SPL-001
normative: "### FG-SPL-001 — Отрыв автономных фрактальных тел\n\nMUST: разрушение материи/связей может разделить тело на независимо движущиеся FractalRing, сохранив принадлежащие им части B и результирующие D, процедурные состояния дочерних областей и генеративный контекст. Физический отрыв не изменяет seed, не перезапускает генератор и не требует существования прежнего физического родителя. Каждому телу назначаются физическая идентичность/кадр, собственная масса, инерция и движение; мировые преобразования и допустимые законы сохранения учитываются. MAY: неизменяемые генеративные данные предков/соседей структурно переиспользуются без активных физических указателей."
lifecycle:
  accepted: false
  current: false
  published: false
