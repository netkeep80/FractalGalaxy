normative: "### FG-STUDIO-016 — Реактивные деревья изменений\n\nПосле создающего persistent override воздействия Studio должен показать созданный FractalRing и пространственную иерархию результирующих деформаций; деревья физического родительства и процедурных источников должны отображать новые записи согласно WorldStore. После разбиения кольца их структура и состояние отображаются без перезагрузки страницы. Просмотр деревьев не должен материализовать записи и не должен изменять координаты вершин."
