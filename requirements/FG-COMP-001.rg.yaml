format: repo-guard/requirement-v1
id: FG-COMP-001
normative: "### FG-COMP-001 — Ациклический лес физических объектов\n\nАктивная и восстановленная после загрузки иерархия FractalRing должна быть лесом без циклов, где каждый узел имеет не более одного текущего физического родителя; команды, нарушающие этот инвариант, должны отклоняться без публикации частичного состояния."
lifecycle:
  accepted: true
  current: true
  published: false
relations:
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/architecture.md"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/acceptance-matrix.md"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/requirements-rationale.md"
  - predicates: [derives_from]
    target:
      kind: requirement
      id: FG-RING-000
