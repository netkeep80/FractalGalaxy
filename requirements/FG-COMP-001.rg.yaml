format: repo-guard/requirement-v1
id: FG-COMP-001
normative: "### FG-COMP-001 — Рекурсивные агрегаты FractalRing с независимыми генераторами детей\n\nMUST: физическое сцепление создаёт новый FractalRing-агрегат со своей локальной системой координат и дочерними FractalRing, сохраняя их собственные процедурные генераторы B, результирующие D и физические идентичности. Агрегат не переинициализирует seed детей; он хранит относительные преобразования и согласованные массовые/динамические агрегаты. MAY: составные агрегаты вкладываются рекурсивно; отрыв дочернего тела восстанавливает независимое движение без регенерации материи. Отличать такое присоединение от физического сплавления или создания нового вещества на границе контакта."
