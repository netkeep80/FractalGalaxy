format: repo-guard/requirement-v1
id: FG-STUDIO-014
normative: "### FG-STUDIO-014 — Дерево результатов E0 Split\n\nStudio должен предоставлять отдельное раскрываемое древовидное представление последовательного разделения текущего E0-материала на области left/rb/rt. Выбор листа должен переходить к точке внутри соответствующей области текущего материального поля и обновлять выбранную octree-ячейку. Дерево Split не должно обозначаться как дерево физического родительства FractalRing."
