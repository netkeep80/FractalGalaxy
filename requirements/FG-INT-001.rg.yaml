format: repo-guard/requirement-v1
id: FG-INT-001
normative: "### FG-INT-001 — Воздействие одного материального тела на другое\n\nMUST: взаимодействие тел определяется как изменение результирующих материальных и/или динамических состояний с явными правилами переноса вещества. Геометрический контакт, трение, адгезия, прочное соединение и фактическое сращивание являются различными состояниями; контакт не должен автоматически выполнять material merge. Операции, использующие форму инструмента, не должны без отдельного правила уничтожать материал самого инструмента."
lifecycle:
