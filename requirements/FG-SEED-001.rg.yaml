normative: "### FG-SEED-001 — Наследование состояния генератора\n\nПри фрактализации система должна получать дочернее состояние генератора из состояния родительской области, индекса ветви и версии алгоритма. Физический отрыв или присоединение не должны создавать дочерней области новое состояние. Для исполнимого E0 предложена конкретная версия Derive32 vE0-1 с тест-векторами."
