format: repo-guard/requirement-v1
id: FG-SEED-001
normative: "### FG-SEED-001 — Наследование генераторов при фрактализации\n\nMUST: каждая дочерняя процедурная область получает собственное детерминированно выводимое состояние генератора из состояния предка и идентификатора ветви В МОМЕНТ ФРАКТАЛЬНОГО УТОЧНЕНИЯ (либо эквивалентно вычисляется по пути уточнения). Физическое разделение не создаёт и не переопределяет seed. Генерация учитывает точную версию правил и канонические адреса, не зависит от порядка обхода, наличия/положения физического родителя, камеры или планирования потоков. MUST: дальнейшее уточнение после отделения эквивалентно уточнению той же процедурной области до отделения при одинаковом неизменяемом контексте генерации. SHOULD: предоставить воспроизводимые целочисленные тест-векторы и версионировать параметры генератора."
lifecycle:
  accepted: false
  current: false
  published: false
