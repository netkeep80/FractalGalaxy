format: repo-guard/requirement-v1
id: FG-VERIFY-001
normative: "### FG-VERIFY-001 — Фальсифицируемые свойства фрактальной материи и FractalRing\n\nMUST: до заявления о реализации гарантии нужны положительные и отрицательные проверки: детерминизм seed при уточнении и независимо от порядка обхода; доступ к исходным параметрам удалённых/разрушенных физических соседей; эквивалентность Refine до/после Detach; смена физического родителя без изменения B/D/seed; составной FractalRing со стабильными локальными кадрами; независимость детей от seed агрегата; согласование 2D/3D границ, сохранение массы и гравитационных агрегатов; сохранение результатов D без журнала. План проверок не равен исполненному свидетельству; отсутствующие тесты не объявлять зелёными."
