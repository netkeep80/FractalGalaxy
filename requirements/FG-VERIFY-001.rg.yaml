format: repo-guard/requirement-v1
id: FG-VERIFY-001
normative: "### FG-VERIFY-001 — Фальсифицируемые свойства ядра\n\nMUST: прежде чем заявлять реализацию гарантий, проводить положительные и отрицательные проверки: повторяемость адресной генерации; независимость от порядка обхода и камеры; согласование 2D/3D границы; сохранение массы при уточнении; восстановление состояния D без журнала; корректность split/merge, координат и владения; локальность пересчёта. Перечень проверок в документе является планом, но не выполненным свидетельством. Отсутствующий тест нельзя объявлять успешным."
lifecycle:
  accepted: false
  current: false
  published: false
relations:
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/verification-plan.md"
