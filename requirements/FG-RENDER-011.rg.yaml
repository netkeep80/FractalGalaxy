format: repo-guard/requirement-v1
id: FG-RENDER-011
normative: "### FG-RENDER-011 — Точный spatial broad-phase visibility ordering\n\nRenderer должен исключать заведомо непересекающиеся в экранной проекции пары треугольников до exact overlap/depth narrow-phase без скрытого квадратичного обхода active-set на разреженных по второй оси сценах. Каждая пара должна передаваться в narrow-phase в каноническом порядке исходных triangle index. Для всех реально перекрывающихся треугольников итоговый painter order должен совпадать с exhaustive ordering. На репрезентативной разреженной сцене narrow-phase candidate pairs должны быть как минимум в 100 раз меньше полного n(n−1)/2, а специальный common-X/disjoint-Y regression должен сохранять subquadratic broad-phase index work."
