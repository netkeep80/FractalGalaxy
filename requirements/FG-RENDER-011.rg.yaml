format: repo-guard/requirement-v1
id: FG-RENDER-011
normative: "### FG-RENDER-011 — Точный spatial broad-phase visibility ordering\n\nRenderer должен исключать заведомо непересекающиеся в экранной проекции пары треугольников до exact overlap/depth narrow-phase. Broad-phase обязан быть conservative: для всех реально перекрывающихся треугольников итоговый painter order должен совпадать с exhaustive ordering. На репрезентативной разреженной сцене число narrow-phase candidate pairs должно быть как минимум в 100 раз меньше полного n(n−1)/2."
