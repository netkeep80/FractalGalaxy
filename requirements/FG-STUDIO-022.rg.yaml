format: repo-guard/requirement-v1
id: FG-STUDIO-022
normative: "### FG-STUDIO-022 — Camera-only redraw без перестроения мира и >=100× controlled speedup\n\nПосле построения текущего Studio-региона изменение только yaw/pitch/zoom камеры не должно повторно вычислять material classification, regional discovery или regional mesh assembly. Camera events должны коалесцироваться через requestAnimationFrame, а переключение на ранее скрытый viewport должно перерисовать его из текущей общей камеры без full world rebuild. В одинаковом Chromium/viewport/scene controlled BASE→HEAD benchmark отдельно для zoom и для реального yaw/pitch pointer-drag медианный camera-only redraw HEAD должен быть как минимум в 100 раз быстрее exact pre-performance BASE; для каждого HEAD-сценария серия не менее 20 redraw должна иметь median <=100 мс и p95 <=150 мс при сохранении proof-aware rendering semantics."
lifecycle:
  accepted: false
  current: false
  published: false
