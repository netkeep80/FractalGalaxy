format: repo-guard/requirement-v1
id: FG-STUDIO-022
normative: "### FG-STUDIO-022 — Camera-only redraw без перестроения мира\n\nПосле построения текущего Studio-региона изменение только yaw/pitch/zoom камеры не должно повторно вычислять material classification, regional discovery или regional mesh assembly. Camera events должны коалесцироваться через requestAnimationFrame. Репрезентативный regional camera-only redraw в Chromium должен укладываться в 100 мс при сохранении proof-aware rendering semantics."
