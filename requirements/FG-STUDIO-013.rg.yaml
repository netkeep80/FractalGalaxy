format: repo-guard/requirement-v1
id: FG-STUDIO-013
normative: "### FG-STUDIO-013 — Раздельные деревья FractalRing\n\nStudio должен предоставлять два семантически разных режима просмотра сохранившихся FractalRing: физическую иерархию по physicalParentId и группировку по стабильному процедурному источнику rootId/address/algorithmId/algorithmVersion. Промежуточные виртуальные адреса не считаются FractalRing. Вложенность, порядок и состояния RESIDENT/UNLOADED должны определяться данными WorldStore без автоматического чтения payload. Если в текущей демонстрации нет записей, Studio должен явно сообщать об отсутствии сохранённых колец, не подменяя его EMPTY-материей и не показывая фиктивные записи."
lifecycle:
