normative: "### FG-RING-012 — Материализация результата редактирования\n\nПри превышении геометрического порога и появлении persistent geometry offset система должна создать FractalRing для индивидуализированной области (или обновить уже существующее кольцо). Для просмотра или подпорогового воздействия новая persistent запись не создаётся. Результатом хранения является действующее смещение, а не последовательность событий мыши."
