normative: "### FG-RING-009 — Прямая материализация глубокой области\n\nИзменение глубокой процедурной области не должно требовать персистентной материализации всех неизменённых промежуточных octree-областей. FractalRing должен иметь возможность непосредственно ссылаться на глубокий процедурный адрес относительно своего источника."
