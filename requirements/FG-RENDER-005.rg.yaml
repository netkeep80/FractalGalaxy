format: repo-guard/requirement-v1
id: FG-RENDER-005
normative: "### FG-RENDER-005 — Доказательная заливка локальной поверхности\n\nПри отображении доказанной локальной поверхности renderer должен растеризовать только треугольники, полученные из proven interface mesh, в предсказуемом порядке по глубине, с производным освещением по ориентации геометрии. Renderer не должен запрашивать изменения авторитетного материального поля или материализовывать FractalRing. Неразрешённая область может иметь только диагностический контур, но не заливку доказанной материи."
lifecycle:
  accepted: false
  current: false
  published: false
