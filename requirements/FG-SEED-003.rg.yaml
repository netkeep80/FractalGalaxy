normative: "### FG-SEED-003 — Воспроизводимость независимых запросов\n\nДля фиксированных исходного seed, полной версии генератора, Γ и канонического адреса система должна возвращать одинаковое целочисленное состояние при прямом холодном запросе, последовательном DFS/BFS, перестановках запросов и разных расписаниях параллельного выполнения. Константный генератор должен отсекаться отдельными эталонными векторами родителя/ветви."
