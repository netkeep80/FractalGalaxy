format: repo-guard/requirement-v1
id: FG-GEO-013
normative: "### FG-GEO-013 — Сохраняемый результат манипуляции вершиной\n\nПри завершении пользовательского перетаскивания вершины E1 должен применять существующий порог влияния и податливость. Если magnitude ≤ threshold, WorldStore и канонический vertex offset остаются неизменными. При превышении ненулевой результирующий offset по стабильному canonical vertex key должен сохраняться независимо от transient жеста, переживать save/load и одинаково применяться к любому представлению той же вершины."
