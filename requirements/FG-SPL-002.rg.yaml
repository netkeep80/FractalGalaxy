format: repo-guard/requirement-v1
id: FG-SPL-002
normative: "### FG-SPL-002 — Поточечный закон разделения\n\nПри разделении (Split) система должна ограничить **исходное**, а не заново пересчитанное результирующее M, включая все записи D, двумя непересекающимися масками, которые вместе покрывают сохраняемую область. На каждой сохраняемой материальной точке её значение M до/после должно совпадать, а правило общей плоскости назначает ровно одного владельца."
