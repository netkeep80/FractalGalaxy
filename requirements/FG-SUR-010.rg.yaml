normative: "### FG-SUR-010 — Рекурсивное извлечение доказанного интерфейса\n\nЕсли исходная грань требует REFINE, система должна рекурсивно сопоставлять только четыре парных incident child-региона по обе стороны грани и возвращать разреженный набор доказанных interface patches. При достижении предельной глубины без доказательства участок должен сохраняться как unresolved, а не превращаться эвристически в поверхность или отсутствие поверхности."
