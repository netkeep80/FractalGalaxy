normative: "### FG-WEB-005 — Studio использует каноническую SurfacePatch geometry\n\nReference и deformed представления recursive interface patches в Experiment Studio должны строиться через тот же SurfacePatch geometry API, что проверяет канонические вершины и crack-free shared edges в ядре. Web UI не должен иметь независимый алгоритм вычисления вершин surface patch."
