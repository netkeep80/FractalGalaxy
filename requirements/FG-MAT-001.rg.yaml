format: repo-guard/requirement-v1
id: FG-MAT-001
normative: "### FG-MAT-001 — Авторитетное текущее состояние материи\n\nMUST: состояние материального тела определяется авторитетным распределением вещества M в локальных пространственных координатах: наличием, составом, плотностью и необходимыми физическими полями. Визуальные треугольники и кэши не являются авторитетным состоянием. MUST: материальное состояние восстанавливается из процедурной базы B и разреженного результирующего состояния изменений D; D хранит текущие результаты, а не обязательную последовательность прежних воздействий."
lifecycle:
  accepted: false
  current: false
  published: false
relations:
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/architecture.md"
