format: repo-guard/requirement-v1
id: FG-ID-001
normative: "### FG-ID-001 — Независимые координаты, идентичности и владение\n\nMUST: пространственная адресация материи, идентичность физического тела, идентичность игрового объекта и текущий родитель FractalRing различаются. Перенос, отрыв и присоединение сохраняют мировую позицию/ориентацию при корректной смене локального кадра. Адреса и опорные точки не привязываются к временным треугольникам LOD. Масса не должна иметь двух физических владельцев из-за структурного совместного использования неизменяемых поддеревьев."
