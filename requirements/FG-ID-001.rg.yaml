format: repo-guard/requirement-v1
id: FG-ID-001
normative: "### FG-ID-001 — Независимость процедурного родства и физической принадлежности\n\nMUST: различать идентичность фрактальной области и её seed, исходный генеративный адрес/соседство, текущий физический FractalRing, текущего физического родителя и его систему координат. Исходное родство и входные параметры генерации сохраняются после отделения, удаления родителя или присоединения к иному агрегату. Переход между FractalRing меняет только физический кадр и механические связи, если не было отдельного материального воздействия. MUST: переподчинение сохраняет мировую позицию/ориентацию, а совместное использование неизменяемых данных не создаёт двух физических владельцев одной массы."
