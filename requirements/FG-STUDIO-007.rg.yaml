format: repo-guard/requirement-v1
id: FG-STUDIO-007
normative: "### FG-STUDIO-007 — Переключение языка без потери контекста\n\nЕсли пользователь выбирает Русский или English, Studio должен немедленно переключать локализуемые подписи без перезагрузки и без изменения выделения, камеры, параметров генерации либо материального состояния. Явный выбор языка должен сохраняться между открытиями. При первом открытии предпочтителен поддерживаемый язык браузера; при отсутствии совпадения используется русский."
lifecycle:
