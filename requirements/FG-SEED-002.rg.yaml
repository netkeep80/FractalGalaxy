format: repo-guard/requirement-v1
id: FG-SEED-002
normative: "### FG-SEED-002 — Автономность дочерней фрактальной структуры после отделения\n\nMUST: при детерминированном уточнении область получает достаточный канонический набор процедурных входов (или способ их воспроизведения) для дальнейшей генерации после исчезновения первоначального физического родителя. Отрыв НЕ является событием выдачи нового seed: унаследованные seed и уже сформированная материя должны оставаться теми же. Дальнейшая фрактализация отделённой части эквивалентна фрактализации исходной области при тех же исходных входах; физическое расстояние до бывшего родителя/соседа не влияет на результат. MAY: неизменяемые источники данных остаются совместно используемыми, но не являются живыми физическими объектами."
lifecycle:
