    target:
      kind: requirement
      id: FG-STUDIO-001
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/studio-workspace-requirements.md"
  - predicates: [verified_by]
    target:
      kind: artifact
      path: "tests/studio-browser.test.mjs"
