format: repo-guard/requirement-v1
id: FG-STUDIO-003
normative: "### FG-STUDIO-003 — Адресная навигация по уровням\n\nКогда ячейка выбрана, пользователь должен иметь возможность перейти к её родителю либо к указанному дочернему octant в пределах поддерживаемой глубины. Studio должен сохранять корректный octree-адрес, а навигация не должна создавать постоянное состояние FractalRing."
lifecycle:
  accepted: false
  current: false
  published: false
