format: repo-guard/requirement-v1
id: FG-LIC-001
normative: "### FG-LIC-001 — Сохранение существующей лицензии проекта\n\nРепозиторий должен сохранять файл LICENSE, содержащий лицензию Unlicense, присутствовавшую в исходном main; изменение условий лицензирования требует отдельного согласованного решения и не является следствием подключения RepoGuard."
lifecycle:
  accepted: true
  current: true
  published: false
relations:
  - predicates: [documents]
    target:
      kind: artifact
      path: "LICENSE"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/vision-and-scope.md"
  - predicates: [derives_from]
    target:
      kind: requirement
      id: FG-PROJECT-000
