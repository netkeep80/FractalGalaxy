normative: "### FG-MRG-001 — Явное присоединение\n\nЯвная операция присоединения (Attach) двух различных живых независимых корней с совместимым жёстким движением должна создавать новый родительский FractalRing K со своей системой координат и двумя исходными дочерними объектами. Повторные, отсутствующие, некорневые и кинематически несовместимые входы должны отклоняться атомарно."
