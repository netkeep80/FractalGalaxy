format: repo-guard/requirement-v1
id: FG-MRG-001
normative: "### FG-MRG-001 — Слипание через составной FractalRing\n\nMUST: сцепление двух или более самостоятельных FractalRing, когда физическая модель требует совместного движения, может образовать новый родительский FractalRing с собственным пространственным кадром и агрегированными физическими характеристиками. Дочерние FractalRing сохраняют свои локальные B, D, seed, процедурные связи и идентичность; новый агрегат не становится источником генерации для уже существующих частей. MUST: переподчинение сохраняет мировые координаты, не дублирует массу и не накладывает чужие маски пустоты. Контакт, адгезия, жёсткая механическая связь и фактическое материальное смешивание различаются; последнее требует отдельной явной модели изменения D и правил новой материи."
lifecycle:
  accepted: false
  current: false
  published: false
