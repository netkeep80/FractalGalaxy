format: repo-guard/requirement-v1
id: FG-RING-005
normative: "### FG-RING-005 — Материализация при индивидуализации\n\nFractalRing должен создаваться, когда области требуется сохраняемое состояние или самостоятельная идентичность, которые уже не представимы только канонической процедурной генерацией. К таким причинам относятся изменение материи, явное переопределение параметров или алгоритма, самостоятельное владение, независимое физическое состояние или изменение физической композиции."
lifecycle:
  accepted: true
  current: true
  published: false
relations:
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: "src/rings/fractal-ring.mjs"
  - predicates: [verified_by]
    target:
      kind: artifact
      path: "tests/sparse-fractalring.test.mjs"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/e1-sparse-fractalring.md"
  - predicates: [derives_from]
    target:
