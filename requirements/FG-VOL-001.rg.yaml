format: repo-guard/requirement-v1
id: FG-VOL-001
normative: "### FG-VOL-001 — Кубическая иерархия с устойчивой процедурной родословной\n\nMUST: объёмная адресация допускает детерминированное разбиение кубической области на восемь потомков или эквивалентное разреженное представление. Процедурный дочерний адрес и его входы могут воспроизводиться без развёрнутого дерева и без существующего физического родителя. Однородные и процедурные области не требуют материализации потомков. Запрос актуального вещества не зависит от глубины визуально развёрнутого дерева; дочерние результаты могут использовать канонические данные соседей из исходной генеративной структуры."
