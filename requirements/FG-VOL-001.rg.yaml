normative: "### FG-VOL-001 — Кубическая объёмная иерархия\n\nMUST: объёмная адресация допускает рекурсивное уточнение кубической области по трём осям на восемь дочерних областей либо эквивалентное разреженное представление. Объём может оставаться процедурным или однородным без полной материализации потомков. MUST: локальный запрос поля вещества имеет определённую семантику независимо от глубины актуально развёрнутого дерева."
