    target:
      kind: artifact
      path: "src/storage/world-store.mjs"
  - predicates: [verified_by]
    target:
      kind: artifact
      path: "tests/world-store.test.mjs"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/e1-world-store.md"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/e1-sparse-fractalring.md"
