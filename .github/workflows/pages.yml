name: Deploy GitHub Pages demo

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "src/**"
      - "tests/web-demo.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run repository tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Assemble static site
        run: |
          set -euo pipefail
          rm -rf .pages
          mkdir -p .pages/src
          cp demo/index.html demo/app.js demo/styles.css demo/studio-picking.mjs demo/studio-i18n.mjs demo/studio-hierarchy.mjs demo/studio-tree.mjs demo/studio-vertex-editor.mjs demo/studio-surface-renderer.mjs .pages/
          cp -R src/. .pages/src/
          touch .pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .pages

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
